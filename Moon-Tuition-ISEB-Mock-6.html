  const students = JSON.parse(localStorage.getItem('students6') || '{}');
  students[u] = p;
  localStorage.setItem('students6', JSON.stringify(students));
  document.getElementById('newUser').value = '';
  document.getElementById('newPass').value = '';
  showStudentList();
  alert('Account created');
}

function showStudentList() {
  const students = JSON.parse(localStorage.getItem('students6') || '{}');
  const list = Object.keys(students).map(u => u + ' / ' + students[u]).join('<br>');
  document.getElementById('studentList').innerHTML = list || 'None';
}

function showAdmin() {
  document.getElementById('homeScreen').classList.remove('hidden');
  document.getElementById('testScreen').classList.add('hidden');
  document.getElementById('reviewScreen').classList.add('hidden');
  document.getElementById('leaderboardScreen').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  showStudentList();
}

function startTest(subject) {
  currentTest = subject;
  currentQ = 0;
  answers = new Array(30).fill(null);
  timeLeft = 900;
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('testScreen').classList.remove('hidden');
  document.getElementById('subjectTitle').textContent = subject.charAt(0).toUpperCase() + subject.slice(1);
  showQuestion();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    document.getElementById('timer').textContent = m + ':' + (s < 10 ? '0' : '') + s;
    if (timeLeft <= 0) finishTest();
  }, 1000);
}

function getQuestions() {
  if (currentTest === 'maths') return mathsQ;
  if (currentTest === 'english') return englishQ;
  if (currentTest === 'vr') return vrQ;
  return nvrQ;
}

function showQuestion() {
  const qs = getQuestions();
  const q = qs[currentQ];
  document.getElementById('qNum').textContent = currentQ + 1;
  document.getElementById('progressBar').style.width = ((currentQ + 1) / 30 * 100) + '%';
  document.getElementById('questionText').innerHTML = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (answers[currentQ] === i ? ' selected' : '');
    if (opt.includes('<svg')) div.innerHTML = opt;
    else div.textContent = opt;
    div.onclick = () => { answers[currentQ] = i; showQuestion(); };
    opts.appendChild(div);
  });
  document.getElementById('nextBtn').textContent = currentQ === 29 ? 'Finish' : 'Next';
}

function nextQuestion() {
  if (currentQ < 29) {
    currentQ++;
    showQuestion();
  } else {
    finishTest();
  }
}

function finishTest() {
  clearInterval(timerInterval);
  const qs = getQuestions();
  let score = 0;
  qs.forEach((q, i) => { if (answers[i] === q.a) score++; });
  const scores = JSON.parse(localStorage.getItem('scores6') || '{}');
  if (!scores[currentUser]) scores[currentUser] = {};
  scores[currentUser][currentTest] = score;
  localStorage.setItem('scores6', JSON.stringify(scores));
  document.getElementById('testScreen').classList.add('hidden');
  document.getElementById('reviewScreen').classList.remove('hidden');
  document.getElementById('reviewTitle').textContent = currentTest.charAt(0).toUpperCase() + currentTest.slice(1) + ' Review';
  document.getElementById('scoreDisplay').textContent = 'Score: ' + score + ' / 30';
  let html = '<h3 style="margin-top:12px;color:#dc2626">Wrong answers</h3>';
  let hasMistakes = false;
  for (let i = 0; i < qs.length; i++) {
    const q = qs[i];
    if (!q) continue;
    const isCorrect = answers[i] === q.a;
    if (!isCorrect) {
      hasMistakes = true;
      let yourAnswer = 'none';
      if (answers[i] !== null && answers[i] !== undefined && q.opts && q.opts[answers[i]]) {
        yourAnswer = String(q.opts[answers[i]]).includes('<svg') ? '[shape]' : q.opts[answers[i]];
      }
      let correctAnswer = '—';
      if (q.opts && q.opts[q.a]) {
        correctAnswer = String(q.opts[q.a]).includes('<svg') ? '[shape]' : q.opts[q.a];
      }
      const questionText = (q.q || 'Question').split('<br>')[0].substring(0, 120);
      html += '<div style="margin:10px 0;padding:10px;background:#fef2f2;border:1px solid #fca5a5;border-radius:6px">';
      html += '<div><b>' + (i+1) + '.</b> ' + questionText + '</div>';
      html += '<div style="color:#dc2626;margin-top:4px">Your answer: ' + yourAnswer + '</div>';
      html += '<div style="color:#16a34a;margin-top:4px">Correct: ' + correctAnswer + '</div>';
      html += '</div>';
    }
  }
  if (!hasMistakes) html += '<p style="color:#16a34a">Perfect score — no mistakes!</p>';
  document.getElementById('reviewContent').innerHTML = html;
}

function showLeaderboard() {
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('leaderboardScreen').classList.remove('hidden');
  const scores = JSON.parse(localStorage.getItem('scores6') || '{}');
  const tbody = document.querySelector('#leaderboardTable tbody');
  tbody.innerHTML = '';
  const rows = Object.keys(scores).map(u => {
    const s = scores[u];
    const total = (s.maths||0) + (s.english||0) + (s.vr||0) + (s.nvr||0);
    return {u, maths:s.maths||'-', english:s.english||'-', vr:s.vr||'-', nvr:s.nvr||'-', total};
  }).sort((a,b) => b.total - a.total);
  rows.forEach((r, i) => {
    tbody.innerHTML += '<tr><td>' + (i+1) + '</td><td>' + r.u + '</td><td>' + r.maths + '</td><td>' + r.english + '</td><td>' + r.vr + '</td><td>' + r.nvr + '</td><td>' + r.total + '</td></tr>';
  });
}

function goHome() {
  document.getElementById('reviewScreen').classList.add('hidden');
  document.getElementById('leaderboardScreen').classList.add('hidden');
  document.getElementById('homeScreen').classList.remove('hidden');
}
</script>
